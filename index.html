<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Wrap for Mac</title>
<meta name="description" content="A sheet of bubble wrap that lives on your Mac. Pop the stress away.">
<meta property="og:title" content="Bubble Wrap for Mac">
<meta property="og:description" content="Deadline in an hour? Pop.">
<meta property="og:image" content="https://ntsh08.github.io/Bubble-Wrap/assets/demo.gif">
<link rel="icon" href="assets/icon.png">
<style>
  :root { --bg: #0d1117; --text: #f0f3f6; --muted: #9198a1; --accent: #f0f3f6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 48px 16px 64px; text-align: center; }
  img.icon { width: 88px; height: 88px; }
  h1 { font-size: 32px; margin: 12px 0 4px; letter-spacing: -0.02em; }
  p.tag { color: var(--muted); margin: 0 0 28px; }
  video { width: 100%; border-radius: 14px; display: block; background: #000; }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0 28px; }
  a.button { display: inline-block; background: var(--accent); color: #0d1117; text-decoration: none;
             font-weight: 600; padding: 12px 22px; border-radius: 999px; }
  .small { color: var(--muted); font-size: 13px; margin-top: 10px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 14px; }
  footer a { color: var(--text); }
</style>
</head>
<body>
<main>
  <img class="icon" src="assets/icon.png" alt="">
  <h1>Bubble Wrap</h1>
  <p class="tag">Deadline in an hour? Inbox at 99+? Pop.</p>

  <video src="assets/bubble-wrap.mp4" poster="assets/demo.gif" controls playsinline preload="metadata"></video>
  <p class="hint">Turn your sound on 🔊</p>

  <a class="button" href="https://github.com/ntsh08/Bubble-Wrap/releases/download/v1.0.0/BubbleWrap-1.0.0.dmg">Download for Mac</a>
  <p class="small">macOS 14 or later · Apple Silicon and Intel · Free</p>

  <footer>
    More of my work at <a href="https://nitishux.com">nitishux.com</a> ·
    <a href="https://buymeacoffee.com/nitishbhardwaj">Buy me a coffee</a>
  </footer>
</main>
</body>
</html>
